      <stop offset="0" stop-color="#ffe3a0"/><stop offset="1" stop-color="#f4b860"/>
    </linearGradient>
    <linearGradient id="villa-messing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecc56a"/><stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
  </defs>
  <g transform="translate(-76 0)">
