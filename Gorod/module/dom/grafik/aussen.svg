  </g>
  <rect x="172" y="200" width="46" height="58" rx="18" fill="url(#villa-licht)" stroke="#fbf7ef" stroke-width="4"/>
  <rect x="160" y="258" width="70" height="6" fill="#d9cdb9"/>
  <path d="M164 258 V246 M174 258 V246 M184 258 V246 M194 258 V246 M204 258 V246 M214 258 V246 M224 258 V246" stroke="#d9cdb9" stroke-width="3"/>
