  <rect x="80" y="104" width="230" height="296" fill="#efe4cf"/>
  <rect x="80" y="104" width="10" height="296" fill="#ddd0b6"/><rect x="300" y="104" width="10" height="296" fill="#ddd0b6"/>
  <polygon points="66,108 195,28 324,108" fill="#3e4855"/>
  <path d="M110 90 H280 M140 72 H250 M170 54 H220" stroke="#4e5a68" stroke-width="2"/>
