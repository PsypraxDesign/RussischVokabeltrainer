  <rect x="166" y="310" width="8" height="82" fill="#fbf7ef"/><rect x="216" y="310" width="8" height="82" fill="#fbf7ef"/>
  <rect x="180" y="318" width="30" height="74" rx="2" fill="#5e3920"/>
  <circle cx="204" cy="356" r="2.5" fill="url(#villa-messing)"/>
