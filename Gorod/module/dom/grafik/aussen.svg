  <rect x="4" y="276" width="78" height="124" fill="#e9dcc2"/>
  <rect x="0" y="268" width="86" height="10" fill="#3e4855"/>
  <rect x="14" y="306" width="58" height="94" rx="3" fill="#c9bda6"/>
  <path d="M14 324 H72 M14 342 H72 M14 360 H72 M14 378 H72" stroke="#b3a68d" stroke-width="2"/>
