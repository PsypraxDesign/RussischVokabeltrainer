<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1a2332" rx="12"/>
  <!-- Trauriges Gesicht -->
  <circle cx="100" cy="85" r="50" fill="#3498db"/>
  <!-- Augen (traurig, nach unten) -->
  <circle cx="82" cy="72" r="5" fill="#2c3e50"/>
  <circle cx="118" cy="72" r="5" fill="#2c3e50"/>
  <circle cx="83" cy="71" r="2" fill="white"/>
  <circle cx="119" cy="71" r="2" fill="white"/>
  <!-- Traurige Augenbrauen -->
  <line x1="72" y1="60" x2="88" y2="64" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="60" x2="112" y2="64" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <!-- Trauriger Mund (nach unten) -->
  <path d="M 80,105 Q 100,90 120,105" stroke="#2c3e50" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Träne -->
  <ellipse cx="78" cy="85" rx="4" ry="7" fill="#AED6F1"/>
  <circle cx="78" cy="80" r="4" fill="#AED6F1"/>
  <text x="100" y="178" text-anchor="middle" fill="#e8b341" font-size="14" font-weight="bold" font-family="sans-serif">грустный</text>
</svg>