<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1a2332" rx="12"/>
  <!-- Dünner Arm -->
  <path d="M 55,130 Q 52,105 58,85 Q 62,72 72,65 Q 80,60 85,65 Q 88,70 82,78 Q 76,88 74,100 Q 70,115 72,130 Z" fill="#FDBCB4"/>
  <!-- Schwache Hand -->
  <ellipse cx="83" cy="67" rx="10" ry="8" fill="#FDBCB4"/>
  <!-- Welke Blume in der Hand -->
  <line x1="83" y1="60" x2="80" y2="30" stroke="#27ae60" stroke-width="2"/>
  <path d="M 80,30 Q 75,25 80,20 Q 85,25 80,30" fill="#a0aec0" opacity="0.5"/>
  <path d="M 80,28 Q 72,28 75,22" stroke="#a0aec0" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 80,28 Q 88,28 85,22" stroke="#a0aec0" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Welke Blätter fallend -->
  <ellipse cx="72" cy="40" rx="4" ry="2" fill="#27ae60" opacity="0.4" transform="rotate(30,72,40)"/>
  <ellipse cx="90" cy="45" rx="3" ry="1.5" fill="#27ae60" opacity="0.3" transform="rotate(-20,90,45)"/>
  <!-- Schwäche-Symbol (Spirale) -->
  <path d="M 130,70 Q 140,60 150,70 Q 155,80 145,85 Q 135,88 132,80" stroke="#a0aec0" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Tropfen (Schweiß) -->
  <ellipse cx="110" cy="90" rx="3" ry="5" fill="#3498db" opacity="0.4"/>
  <ellipse cx="120" cy="100" rx="2.5" ry="4" fill="#3498db" opacity="0.3"/>
  <text x="100" y="178" text-anchor="middle" fill="#e8b341" font-size="14" font-weight="bold" font-family="sans-serif">слабый</text>
</svg>