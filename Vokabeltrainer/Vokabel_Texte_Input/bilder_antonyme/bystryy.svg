  <line x1="45" y1="112" x2="72" y2="112" stroke="#e8b341" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <text x="100" y="178" text-anchor="middle" fill="#e8b341" font-size="14" font-weight="bold" font-family="sans-serif">быстрый</text>
