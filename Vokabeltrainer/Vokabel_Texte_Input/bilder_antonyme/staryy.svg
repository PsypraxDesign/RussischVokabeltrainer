<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1a2332" rx="12"/>
  <!-- Alter knorriger Baum -->
  <rect x="85" y="80" width="18" height="70" fill="#5D4037"/>
  <!-- Knorrige Äste -->
  <path d="M 92,80 Q 70,60 50,50" stroke="#5D4037" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 98,80 Q 130,55 155,48" stroke="#5D4037" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 90,95 Q 55,85 40,90" stroke="#5D4037" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 100,100 Q 140,90 160,95" stroke="#5D4037" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Wenige Blätter (herbstlich) -->
  <circle cx="48" cy="45" r="10" fill="#c0392b" opacity="0.7"/>
  <circle cx="155" cy="42" r="12" fill="#e67e22" opacity="0.7"/>
  <circle cx="38" cy="85" r="8" fill="#e67e22" opacity="0.6"/>
  <circle cx="162" cy="90" r="9" fill="#c0392b" opacity="0.6"/>
  <!-- Fallende Blätter -->
  <ellipse cx="70" cy="120" rx="5" ry="3" fill="#e67e22" opacity="0.5" transform="rotate(30,70,120)"/>
  <ellipse cx="140" cy="115" rx="4" ry="2.5" fill="#c0392b" opacity="0.5" transform="rotate(-20,140,115)"/>
  <ellipse cx="55" cy="140" rx="4" ry="2.5" fill="#f39c12" opacity="0.4" transform="rotate(45,55,140)"/>
  <!-- Rinde-Textur -->
  <line x1="90" y1="90" x2="88" y2="100" stroke="#4E342E" stroke-width="1.5"/>
  <line x1="98" y1="105" x2="96" y2="120" stroke="#4E342E" stroke-width="1.5"/>
  <line x1="92" y1="125" x2="90" y2="140" stroke="#4E342E" stroke-width="1.5"/>
  <!-- Gras -->
  <rect x="20" y="148" width="160" height="22" rx="5" fill="#1a5e2a" opacity="0.5"/>
  <text x="100" y="185" text-anchor="middle" fill="#e8b341" font-size="14" font-weight="bold" font-family="sans-serif">старый</text>
</svg>