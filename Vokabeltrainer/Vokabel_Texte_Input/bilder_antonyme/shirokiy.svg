<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1a2332" rx="12"/>
  <!-- Breite Straße (Perspektive) -->
  <polygon points="20,160 180,160 130,50 70,50" fill="#4a5568"/>
  <!-- Mittelstreifen -->
  <line x1="100" y1="55" x2="100" y2="70" stroke="#f1c40f" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="100" y1="80" x2="100" y2="95" stroke="#f1c40f" stroke-width="2.5" stroke-dasharray="8,5"/>
  <line x1="100" y1="105" x2="100" y2="125" stroke="#f1c40f" stroke-width="3" stroke-dasharray="10,5"/>
  <line x1="100" y1="135" x2="100" y2="158" stroke="#f1c40f" stroke-width="3.5" stroke-dasharray="10,5"/>
  <!-- Randstreifen -->
  <line x1="72" y1="50" x2="22" y2="160" stroke="white" stroke-width="1.5"/>
  <line x1="128" y1="50" x2="178" y2="160" stroke="white" stroke-width="1.5"/>
  <!-- Breite-Pfeil unten -->
  <line x1="35" y1="145" x2="165" y2="145" stroke="#e8b341" stroke-width="2"/>
  <polygon points="39,141 28,145 39,149" fill="#e8b341"/>
  <polygon points="161,141 172,145 161,149" fill="#e8b341"/>
  <!-- Bäume am Rand -->
  <circle cx="30" cy="85" r="10" fill="#27ae60" opacity="0.5"/>
  <circle cx="170" cy="85" r="10" fill="#27ae60" opacity="0.5"/>
  <circle cx="22" cy="115" r="12" fill="#27ae60" opacity="0.5"/>
  <circle cx="178" cy="115" r="12" fill="#27ae60" opacity="0.5"/>
  <text x="100" y="185" text-anchor="middle" fill="#e8b341" font-size="14" font-weight="bold" font-family="sans-serif">широкий</text>
</svg>